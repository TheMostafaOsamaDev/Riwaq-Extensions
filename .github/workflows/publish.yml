name: Publish

# Builds dist/ from main and publishes it to the `repo` branch, which
# GitHub Pages serves — this is the exact code and catalogue the reader
# app downloads and runs, so every step here is a plain, auditable git
# command rather than a third-party publish action.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Two publish runs overlapping (e.g. two PRs merged a minute apart) would
# both build on the same `repo` tip. Since publishing is append-only, the
# slower one's push is then a non-fast-forward and the remote rejects it —
# a failed publish rather than a silent revert, but still a publish that
# did not happen. Queuing same-group runs one at a time removes the race.
# cancel-in-progress stays false on purpose: cancelling a publish
# mid-push is worse than making the next one wait a few seconds.
concurrency:
  group: publish-repo-branch
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish dist/ to the repo branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-version-bump.ts (below) needs the pre-push commit
          # (`github.event.before`) as a real object to diff against, and
          # needs to be able to read the `repo` branch's published index
          # — a shallow clone would silently break both. Same requirement,
          # same setting, as ci.yml's checkout.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate manifests
        run: pnpm validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Same gate as ci.yml's PR-only check, run again here: ci.yml only
      # protects the pull_request path, so any change that reaches main
      # without going through PR CI (a direct push, an admin merge that
      # skips checks, …) would otherwise republish changed bytes under an
      # already-published (id, version) pair with nothing to catch it.
      # PUBLISH_BASE_SHA is the push event's own "before" SHA (the tip of
      # main immediately before this push) — GITHUB_BASE_REF is a
      # pull_request-only variable, and by the time this job runs,
      # origin/main already IS this push's HEAD, so diffing against it
      # would always see an empty diff. See check-version-bump.ts for how
      # this is used, and its all-zeros case (a brand-new branch, which
      # is also necessarily the very-first-publish case below).
      - name: Check version bumps
        env:
          PUBLISH_BASE_SHA: ${{ github.event.before }}
        run: pnpm exec tsx scripts/check-version-bump.ts

      # Plain git, no third-party action: check the `repo` branch out in a
      # separate worktree (so main's checkout is untouched), lay dist/'s
      # contents over its root — not the dist/ directory itself, because
      # index.min.json's "code"/"icon" paths are relative to its own
      # location, so it and the per-extension folders must be siblings at
      # the branch root — add .nojekyll so GitHub Pages serves folders even
      # if one ever starts with an underscore, then commit and push.
      #
      # Publishing APPENDS rather than replacing. An earlier version
      # force-pushed a fresh orphan commit each run, which left the branch
      # with no history: a tampered publish would have looked identical to a
      # legitimate one. Committing on top makes the branch append-only, so a
      # `non_fast_forward` ruleset can be enabled on it with NO bypass actor
      # — which matters because GitHub only allows the Actions integration
      # as a bypass actor on org-owned repos, never on a user-owned one, so
      # a force-pushing workflow could not be protected here at all.
      #
      # The tree is cleared before copying so a file dropped from a build
      # actually disappears from the branch. check-version-bump.ts only ever
      # reads the tip, so the added history costs it nothing.
      - name: Publish dist/ to the repo branch
        env:
          # Routed through env: rather than interpolated straight into the
          # script, even though github.sha is always a git-computed 40-hex
          # commit hash (never attacker-controlled text) — this workflow
          # has contents: write, so it keeps every ${{ }} out of the run:
          # body on principle, not just where it's exploitable today.
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUBLISH_DIR="$(mktemp -d)"

          if git ls-remote --exit-code --heads origin repo >/dev/null 2>&1; then
            # Build on the existing tip so the push fast-forwards. Full fetch,
            # not --depth=1: pushing a new commit from a shallow worktree can
            # be rejected, and this branch only ever holds one small dist/.
            git fetch --no-tags origin repo
            # Resolve to a SHA first: FETCH_HEAD is a per-repository ref and
            # does not resolve from inside the new worktree.
            PUBLISHED_TIP="$(git rev-parse FETCH_HEAD)"
            git worktree add --detach "$PUBLISH_DIR" "$PUBLISHED_TIP"
            git -C "$PUBLISH_DIR" checkout -q -B repo "$PUBLISHED_TIP"
          else
            # First publish: nothing to build on, so start the branch here.
            git worktree add --detach "$PUBLISH_DIR"
            git -C "$PUBLISH_DIR" checkout -q --orphan repo
          fi

          # Clear the tree and lay dist/ down fresh, so a file deleted from a
          # build genuinely disappears from the branch instead of lingering.
          git -C "$PUBLISH_DIR" rm -rq --ignore-unmatch .

          cp -R dist/. "$PUBLISH_DIR"/
          touch "$PUBLISH_DIR"/.nojekyll

          git -C "$PUBLISH_DIR" add -A

          if git -C "$PUBLISH_DIR" diff --cached --quiet; then
            echo "dist/ is byte-identical to the published tip — nothing to publish."
            exit 0
          fi

          git -C "$PUBLISH_DIR" commit --quiet -m "publish: dist/ from $SOURCE_SHA"
          git -C "$PUBLISH_DIR" push origin repo

          git worktree remove "$PUBLISH_DIR" --force
